name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Verify project paths
        run: |
          set -euo pipefail
          test -f Companydle.sln
          test -f src/Companydle/Companydle.csproj
          test -f tests/Companydle.Tests/Companydle.Tests.csproj

      - name: Test
        run: dotnet test Companydle.sln -c Release

      - name: Publish
        run: dotnet publish src/Companydle/Companydle.csproj -c Release -o publish -p:GHPages=true -p:GHPagesBase=/companydle/

      - name: Patch published PWA base path
        run: |
          set -euo pipefail
          sed -i 's|^const base = "/";$|const base = "/companydle/";|' publish/wwwroot/service-worker.js
          rm -f publish/wwwroot/service-worker.js.br publish/wwwroot/service-worker.js.gz
          grep -Fq 'const base = "/companydle/";' publish/wwwroot/service-worker.js
          grep -Fq '<base href="/companydle/"' publish/wwwroot/index.html
          grep -Fq '<base href="/companydle/"' publish/wwwroot/404.html
          grep -Fq 'data\/companies.json' publish/wwwroot/service-worker-assets.js
          grep -Fq '/\.br$/' src/Companydle/wwwroot/service-worker.published.js
          test ! -f publish/wwwroot/service-worker.js.br
          test ! -d publish/wwwroot/lib/bootstrap/dist/js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
